<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FileForge</title>
<script src="lucide.min.js"></script>
<style>
:root{
  --bg:rgba(22,22,30,.96); --bg2:rgba(32,32,44,.97); --line:rgba(255,255,255,.09);
  --txt:#f5f5fa; --mut:#a3a3b8; --acc:#7c5cff;
}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Helvetica Neue",sans-serif;
  color:var(--txt);-webkit-user-select:none;user-select:none;cursor:default}
#stage{position:absolute;left:0;top:0;width:760px;height:760px}
.layer{position:absolute;left:0;top:0;width:760px;height:760px;pointer-events:none;
  transform-origin:380px 380px;transform:scale(.8) rotate(-10deg);opacity:0;
  transition:transform .36s cubic-bezier(.2,.9,.25,1.12),opacity .22s}
.layer.in{transform:none;opacity:1}
.layer.out{transform:scale(1.08);opacity:0;transition:transform .18s,opacity .15s}
.layer > svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 14px 28px rgba(0,0,0,.45))}
.seg{pointer-events:visiblePainted;fill:var(--bg);stroke:var(--line);stroke-width:1;cursor:pointer;
  transition:fill .14s ease, opacity .2s}
.seg:hover,.seg.on,.seg.kb{fill:var(--c)}
.seg.def{stroke:var(--c);stroke-width:2}
.dim .seg{opacity:.32}
.lbl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;
  gap:5px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.18;color:var(--txt);
  pointer-events:none;letter-spacing:.1px;text-shadow:0 1px 2px rgba(0,0,0,.35);transition:color .14s}
.lbl svg{position:static;flex:none;color:var(--c);transition:color .14s, transform .2s}
.lbl.on svg{color:#fff;transform:scale(1.12)}
.lbl span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cats .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.hub{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(44,44,60,.98),var(--bg) 70%);
  border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-sizing:border-box;padding:20px;transform:scale(.55);opacity:0;
  transition:transform .34s cubic-bezier(.2,.9,.25,1.25),opacity .2s;overflow:hidden}
.hub.in{transform:none;opacity:1}
.badge{font-size:12px;font-weight:800;letter-spacing:1px;padding:5px 10px;border-radius:8px;
  background:var(--c);color:#fff;margin-bottom:9px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.fname{font-size:13px;font-weight:650;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11px;color:var(--mut);margin-top:3px}
.hint{font-size:10px;color:var(--mut);margin-top:9px;opacity:.75}
.big{color:var(--c,#fff);margin-bottom:8px}
.title{font-size:13.5px;font-weight:650;line-height:1.25}
.q{font-size:13px;line-height:1.4;font-weight:550;white-space:pre-wrap;max-height:150px;overflow:auto}
.notes{font-size:10.5px;color:var(--mut);margin-top:7px;line-height:1.35;white-space:pre-wrap}
.files{font-size:11px;color:var(--txt);opacity:.85;margin-top:5px;line-height:1.35;max-width:100%}
.files div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input{width:100%;box-sizing:border-box;margin-top:14px;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);color:var(--txt);
  font:14px -apple-system,"Segoe UI",sans-serif;outline:none;text-align:center;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.3)}
.btns{display:flex;gap:8px;margin-top:12px}
button{border:0;border-radius:9px;padding:8px 16px;font:600 12.5px -apple-system,"Segoe UI",sans-serif;
  background:var(--acc);color:#fff;cursor:pointer}
button.ghost{background:rgba(255,255,255,.08);color:var(--txt)}
button:hover{filter:brightness(1.15)}
.back{position:absolute;bottom:16px;font-size:10.5px;color:var(--mut);cursor:pointer;padding:3px 8px;border-radius:6px}
.back:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.spin{position:absolute;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg,#7c5cff 120deg,#ec4899 220deg,transparent 300deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
  animation:rot 1s linear infinite;opacity:0;transition:opacity .3s}
.spin.in{opacity:1}
@keyframes rot{to{transform:rotate(360deg)}}
.halo{position:absolute;border-radius:50%;border:1.5px dashed rgba(255,255,255,.22);transition:all .2s;pointer-events:none}
.drag .halo{border-color:var(--acc);box-shadow:0 0 0 8px rgba(124,92,255,.15),0 0 60px rgba(124,92,255,.45)}
.check path,.check polyline{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* recherche de fichiers */
.orb{position:absolute;left:50px;top:50px;width:660px;height:660px;border-radius:50%;box-sizing:border-box;
  background:radial-gradient(circle at 50% 22%,rgba(46,46,64,.985),var(--bg) 62%);border:1px solid var(--line);
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);
  transform:scale(.62);opacity:0;transition:transform .34s cubic-bezier(.2,.9,.25,1.12),opacity .2s}
.orb.in{transform:none;opacity:1}
.f-q{position:absolute;left:140px;top:72px;width:380px;height:46px;box-sizing:border-box;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-radius:14px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.12);color:var(--mut)}
.f-q:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.28)}
.f-q input{all:unset;flex:1;font-size:16px;font-weight:550;color:var(--txt);-webkit-user-select:text;user-select:text}
.f-q input::placeholder{color:#6f6f86}
.f-list{position:absolute;left:68px;top:140px;width:524px;height:340px;display:flex;flex-direction:column;gap:2px}
.f-row{display:flex;align-items:center;gap:11px;height:46px;flex:none;padding:0 12px;border-radius:12px;cursor:pointer;
  box-sizing:border-box;transition:background .1s}
.f-row.on{background:rgba(124,92,255,.22);box-shadow:inset 0 0 0 1px rgba(124,92,255,.45)}
.f-ic{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;color:var(--c);
  background:color-mix(in srgb,var(--c) 16%,transparent)}
.f-tx{flex:1;min-width:0}
.f-nm{font-size:13px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-nm mark{background:none;color:#c4b5fd;text-decoration:underline;text-decoration-color:rgba(167,139,250,.6);text-underline-offset:2px}
.f-dr{font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;direction:rtl;text-align:left}
.f-dr bdi{direction:ltr}
.f-mt{font-size:10.5px;color:var(--mut);text-align:right;flex:none;line-height:1.35}
.f-act{display:none;gap:4px;flex:none}
.f-row.on .f-act{display:flex}
.f-row.on .f-mt{display:none}
.f-act span{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--txt);background:rgba(255,255,255,.08)}
.f-act span:hover{background:var(--acc)}
.f-empty{margin:70px auto 0;text-align:center;color:var(--mut);font-size:12.5px;line-height:1.5}
.f-empty b{display:block;color:var(--txt);font-size:14px;margin:8px 0 4px}
.f-sec{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#7c7c96;padding:2px 12px 4px}
.f-help{position:absolute;left:150px;top:496px;width:360px;text-align:center;font-size:10.5px;color:var(--mut);line-height:1.7}
.f-help kbd{font:600 10px -apple-system,"Segoe UI",sans-serif;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.1);color:var(--txt)}
.f-count{position:absolute;left:200px;top:548px;width:260px;text-align:center;font-size:10px;color:#6f6f86}
.find-pill{margin-top:10px;font-size:11px;color:var(--mut);cursor:pointer;padding:5px 11px;border-radius:999px;
  border:1px solid rgba(255,255,255,.12);display:inline-flex;align-items:center;gap:6px}
.find-pill:hover{color:var(--txt);border-color:var(--acc)}
.search{font-size:15px;font-weight:650;color:#fff}
.search small{display:block;font-size:10.5px;color:var(--mut);font-weight:500;margin-top:5px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const C = 380, NS = 'http://www.w3.org/2000/svg';
const stage = document.getElementById('stage');
let standalone = false;
let S = null, mode = null, query = '', kb = {level: 'cat', ci: -1, ai: -1};
let catItems = [], fanItems = [], fanL = null, curCat = -1, ringItems = [], hubEl = null, busyText = '';

const ICONS = {Ouvrir:'external-link', Afficher:'folder-open', 'Enchaîner':'sparkles', Retour:'undo-2',
  Fermer:'x', Journal:'scroll-text', OK:'check', Annuler:'x', Renommer:'check'};

function api(v){ try{ window.pywebview.api.answer(v) }catch(e){ console.log(e) } }
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function icon(name, size = 20){
  try{
    const pas = name.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('');
    const node = lucide.icons[pas]; if(!node) return '';
    const el = lucide.createElement(node);
    el.setAttribute('width', size); el.setAttribute('height', size); el.setAttribute('stroke-width', '1.9');
    return el.outerHTML;
  }catch(e){ return '' }
}
function pt(r, a){ const t = (a - 90) * Math.PI / 180; return [C + r * Math.cos(t), C + r * Math.sin(t)] }
function sector(r0, r1, a0, a1){
  const large = (a1 - a0) > 180 ? 1 : 0;
  const [x0,y0] = pt(r1,a0), [x1,y1] = pt(r1,a1), [x2,y2] = pt(r0,a1), [x3,y3] = pt(r0,a0);
  return `M${x0} ${y0}A${r1} ${r1} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 0 ${x3} ${y3}Z`;
}
function annulus(r0, r1){
  return `M${C} ${C-r1}A${r1} ${r1} 0 1 1 ${C-.01} ${C-r1}Z M${C} ${C-r0}A${r0} ${r0} 0 1 0 ${C-.01} ${C-r0}Z`;
}
function enter(el){ requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in'))) }
function layer(cls){
  const d = document.createElement('div'); d.className = 'layer ' + (cls || '');
  d.innerHTML = '<svg width="760" height="760" viewBox="0 0 760 760"></svg>';
  stage.appendChild(d); enter(d); return d;
}
function dropLayer(L){ if(!L) return; L.classList.remove('in'); L.classList.add('out'); setTimeout(() => L.remove(), 200) }

function ring(L, items, o){
  const svg = L.querySelector('svg'), n = items.length, w = o.span / n, g = o.gap ?? 1.4;
  items.forEach((it, i) => {
    const a0 = o.start + i * w, a1 = a0 + w, full = n === 1 && o.span >= 359;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', full ? annulus(o.r0, o.r1) : sector(o.r0, o.r1, a0 + g/2, a1 - g/2));
    p.setAttribute('fill-rule', 'evenodd');
    p.setAttribute('class', 'seg' + (it.def ? ' def' : ''));
    p.style.setProperty('--c', it.color || 'var(--acc)');
    p.addEventListener('mouseenter', () => o.hover && o.hover(i, it));
    p.addEventListener('click', e => { e.stopPropagation(); o.click && o.click(i, it) });
    svg.appendChild(p); it._p = p;
    const mid = (a0 + a1) / 2, rm = (o.r0 + o.r1) / 2;
    const [x, y] = full ? [C, C - rm] : pt(rm, mid);
    const arc = Math.min(w, 180) * Math.PI / 180 * rm;
    const mw = Math.max(58, Math.min(o.maxw || 120, arc * .8));
    const lb = document.createElement('div'); lb.className = 'lbl';
    lb.style.cssText = `left:${x}px;top:${y}px;width:${mw}px`;
    lb.style.setProperty('--c', it.color || 'var(--acc)');
    lb.innerHTML = (it.icon ? icon(it.icon, o.isz || 20) : '') + (it.label ? `<span>${esc(it.label)}</span>` : '');
    L.appendChild(lb); it._l = lb;
  });
  return items;
}
function setOn(items, idx, cls = 'on'){
  items.forEach((it, j) => { it._p.classList.toggle(cls, j === idx); it._l.classList.toggle('on', j === idx) });
}
function hub(r, html, style = ''){
  if(hubEl) hubEl.remove();
  const h = document.createElement('div'); h.className = 'hub';
  h.style.cssText = `left:${C-r}px;top:${C-r}px;width:${2*r}px;height:${2*r}px;${style}`;
  h.innerHTML = html; stage.appendChild(h); enter(h); hubEl = h; return h;
}
function hubSet(html){ if(hubEl) hubEl.innerHTML = html }
function reset(){ stage.innerHTML = ''; hubEl = null; fanL = null; fanItems = []; ringItems = []; catItems = []; curCat = -1; query = ''; document.body.classList.remove('drag') }

/* ───────── MAIN : catégories + éventail d'actions ───────── */
function hubInfo(){
  return `<div class="badge" style="--c:${S.color}">${esc(S.badge)}</div>
    <div class="fname">${esc(S.title)}</div><div class="sub">${esc(S.subtitle)}</div>
    <div class="hint">tape pour chercher</div>`;
}
function hubAction(it){
  hubSet(`<div class="big" style="--c:${it.color}">${icon(it.icon, 30)}</div>
    <div class="title">${esc(it.full)}</div><div class="hint">clic ou Entrée</div>`);
}
function showMain(st){
  reset(); S = st; mode = 'main'; kb = {level:'cat', ci:-1, ai:-1};
  const n = st.cats.length, w = 360 / n;
  const L = layer('cats');
  catItems = ring(L, st.cats.map(c => ({label:c.label, icon:c.icon, color:c.color})),
    {r0:98, r1:178, start:-w/2, span:360, gap:1.6, isz:22, maxw:96,
     hover:(i) => { kb = {level:'cat', ci:i, ai:-1}; openCat(i); hubSet(hubInfo()) },
     click:(i) => openCat(i)});
  L.classList.add('cats');
  hub(92, hubInfo());
  if(n === 1) openCat(0);
}
function openCat(i){
  if(curCat === i && fanL) return;
  curCat = i; setOn(catItems, i);
  const cat = S.cats[i], k = cat.actions.length, w0 = 360 / S.cats.length;
  let w = Math.min(46, Math.max(30, 300 / k)), span = k * w;
  if(span > 352){ w = 352 / k; span = 352 }
  const mid = i * w0;
  dropLayer(fanL); fanL = layer('fan');
  fanItems = ring(fanL, cat.actions.map(a => ({...a, color:cat.color})),
    {r0:186, r1:308, start:mid - span/2, span, gap:1.2, maxw:112,
     hover:(j, it) => { kb = {level:'act', ci:i, ai:j}; setOn(fanItems, j, 'kb'); hubAction(it) },
     click:(j, it) => pick(it)});
}
function renderSearch(){
  if(!query){ dropLayer(fanL); fanL = null; curCat = -1; setOn(catItems, -1);
    stage.querySelector('.cats').classList.remove('dim'); hubSet(hubInfo()); return }
  const nq = norm(query);
  const res = [];
  S.cats.forEach(c => c.actions.forEach(a => { if(norm(a.full + ' ' + c.label + ' ' + a.label).includes(nq)) res.push({...a, color:c.color}) }));
  stage.querySelector('.cats').classList.add('dim'); setOn(catItems, -1); curCat = -1;
  dropLayer(fanL); fanL = null; fanItems = [];
  if(res.length){
    const m = Math.min(res.length, 12); let w = Math.max(30, Math.min(46, 352 / m)), span = m * w;
    fanL = layer('fan');
    fanItems = ring(fanL, res.slice(0, 12), {r0:186, r1:308, start:-span/2, span, gap:1.2, maxw:112,
      hover:(j, it) => { kb.ai = j; setOn(fanItems, j, 'kb'); hubAction(it) }, click:(j, it) => pick(it)});
    kb = {level:'act', ci:-1, ai:0}; setOn(fanItems, 0, 'kb');
  }
  hubSet(`<div class="search">« ${esc(query)} »<small>${res.length ? res.length + ' résultat' + (res.length > 1 ? 's' : '') + ' · Entrée' : 'aucun résultat'}</small></div>`);
}
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase() }
function pick(it){ showBusy(it.full); api(it.id) }

/* ───────── CHOIX (options d'une action) ───────── */
function showRing(hubHtml, items, onPick, opts = {}){
  reset(); mode = opts.mode || 'choice';
  const n = items.length, w = 360 / n;
  const L = layer();
  ringItems = ring(L, items, {r0:opts.r0 || 124, r1:opts.r1 || (items.length > 6 ? 282 : 246), start:-w/2, span:360, gap:n > 1 ? 1.5 : 0,
    maxw:opts.maxw || 130, isz:20,
    hover:(i) => { kb.ai = i; setOn(ringItems, i, 'kb') }, click:(i, it) => onPick(it, i)});
  kb = {level:'ring', ai:opts.def ?? -1};
  if(kb.ai >= 0) setOn(ringItems, kb.ai, 'kb');
  hub(opts.hr || 114, hubHtml);
}
function showChoice(st){
  const items = st.items.map(x => ({label:x, value:x, color:'#7c5cff', def:x === st.default}));
  showRing(`<div class="q">${esc(st.prompt)}</div><div class="back" onclick="api('__cancel__')">← retour</div>`,
    items, it => { showBusy(busyText); api(it.value) }, {def:Math.max(0, st.items.indexOf(st.default))});
}
function showCard(st){
  const items = st.buttons.map(b => ({label:b, value:b, icon:ICONS[b] || 'circle', color:b === 'Annuler' ? '#64748b' : '#7c5cff'}));
  const di = st.buttons.indexOf(st.default || st.buttons[st.buttons.length - 1]);
  showRing(`<div class="q" style="font-size:12px;max-height:260px;text-align:left">${esc(st.text)}</div>`,
    items, it => { showBusy(busyText); api(it.value) }, {r0:196, r1:262, hr:186, def:di, maxw:110});
}
function showAsk(st){
  reset(); mode = 'ask';
  const h = hub(180, `<div class="q">${esc(st.prompt)}</div>
    <input id="in" type="${st.hidden ? 'password' : 'text'}" spellcheck="false" autocomplete="off">
    <div class="btns"><button class="ghost" id="no">Annuler</button><button id="ok">Valider</button></div>`,
    'padding:38px');
  const L = layer(); L.querySelector('svg').innerHTML =
    `<circle cx="${C}" cy="${C}" r="196" fill="none" stroke="rgba(124,92,255,.55)" stroke-width="2" stroke-dasharray="3 7"/>`;
  const inp = h.querySelector('#in'); inp.value = st.default || '';
  const ok = () => { showBusy(busyText); api(inp.value) };
  h.querySelector('#ok').onclick = ok; h.querySelector('#no').onclick = () => api('__cancel__');
  inp.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); ok() }
    if(e.key === 'Escape'){ e.preventDefault(); api('__cancel__') }
    e.stopPropagation();
  });
  setTimeout(() => { inp.focus(); inp.select() }, 60);
}

/* ───────── PROGRESSION / RÉSULTAT / ERREUR ───────── */
function showBusy(text){
  if(text) busyText = text;
  if(mode === 'busy' && hubEl){ hubSet(busyHtml()); return }
  reset(); mode = 'busy';
  const s = document.createElement('div'); s.className = 'spin';
  s.style.cssText = `left:${C-122}px;top:${C-122}px;width:244px;height:244px`;
  stage.appendChild(s); enter(s);
  hub(108, busyHtml());
}
function busyHtml(){ return `<div class="big" style="--c:#a78bfa">${icon('loader', 26)}</div><div class="title">${esc(busyText || 'Traitement…')}</div><div class="hint">patiente un instant</div>` }
function resultItems(list){ return list.map(x => ({label:x, value:x, icon:ICONS[x] || 'circle',
  color:x === 'Fermer' ? '#64748b' : x === 'Retour' ? '#475569' : '#22c55e'})) }
function showDone(st){
  const n = st.outs.length;
  const files = st.outs.slice(0, 3).map(f => `<div>${esc(f)}</div>`).join('') + (n > 3 ? `<div>+ ${n - 3} autres</div>` : '');
  const ck = icon('circle-check', 34).replace('<svg', '<svg class="check"');
  showRing(`<div class="big" style="--c:#22c55e">${ck}</div>
    <div class="title">${n ? (n > 1 ? n + ' éléments créés' : 'Terminé') : 'Terminé'}</div>
    <div class="files">${files}</div>${st.notes.length ? `<div class="notes">${esc(st.notes.join('\n'))}</div>` : ''}`,
    resultItems(st.items), it => api(it.value), {mode:'done', r0:136, r1:236, hr:128, def:0, maxw:96});
}
function showError(st){
  showRing(`<div class="big" style="--c:#ef4444">${icon('circle-alert', 32)}</div>
    <div class="title">L'action a échoué</div><div class="notes" style="color:#fca5a5;max-height:110px;overflow:auto">${esc(st.text)}</div>`,
    resultItems(st.items).map(x => ({...x, color:x.value === 'Retour' ? '#7c5cff' : x.color})),
    it => api(it.value), {mode:'error', r0:136, r1:226, hr:128, def:0, maxw:96});
}

/* ───────── DÉPÔT DE FICHIERS ───────── */
function showDrop(){
  reset(); mode = 'drop';
  const halo = document.createElement('div'); halo.className = 'halo';
  halo.style.cssText = `left:${C-190}px;top:${C-190}px;width:380px;height:380px`; stage.appendChild(halo);
  const h = hub(170, `<div class="big" style="--c:#a78bfa">${icon('upload', 38)}</div>
    <div class="title" style="font-size:16px">Dépose tes fichiers ici</div>
    <div class="sub" style="margin:6px 0 14px">PDF, images, vidéos, audio, documents…</div>
    <button id="br">Parcourir…</button>
    <div class="find-pill" id="fp">${icon('search', 13)} Chercher un fichier</div>
    <div class="hint">ou tape directement son nom · Échap pour fermer</div>`);
  h.querySelector('#br').onclick = () => api('__browse__');
  h.querySelector('#fp').onclick = () => showFind('');
  try{ window.pywebview.api.find_warmup() }catch(e){}
}

/* ───────── RECHERCHE DE FICHIERS ───────── */
const KIND = {pdf:['file-text','#ef4444'], image:['image','#22c55e'], video:['film','#a855f7'], audio:['music','#f59e0b'],
  word:['file-text','#3b82f6'], excel:['sheet','#10b981'], powerpoint:['presentation','#f97316'], archive:['archive','#94a3b8'],
  folder:['folder','#60a5fa'], app:['app-window','#e2e8f0'], file:['file','#a3a3b8'], gone:['file','#64748b']};
let F = {res:[], sel:0, seq:0, q:'', timer:null};
function showFind(q){
  reset(); mode = 'find'; F = {res:[], sel:0, seq:0, q:null, timer:null};
  const o = document.createElement('div'); o.className = 'orb';
  o.innerHTML = `<label class="f-q">${icon('search', 18)}<input id="fq" spellcheck="false" autocomplete="off"
      placeholder="Nom du fichier… (ex : facture edf pdf)"></label>
    <div class="f-list" id="fl"></div>
    <div class="f-help"><kbd>↩</kbd> afficher dans le dossier · <kbd>${S && S.platform === 'darwin' || navigator.platform.startsWith('Mac') ? '⌘' : 'Ctrl'}↩</kbd> ouvrir · <kbd>Tab</kbd> roue FileForge</div>
    <div class="f-count" id="fc"></div>`;
  stage.appendChild(o); enter(o); hubEl = o;
  const inp = o.querySelector('#fq'); inp.value = q || '';
  inp.addEventListener('input', () => findQuery(inp.value));
  inp.addEventListener('keydown', findKey);
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  findQuery(inp.value, true);
}
function findQuery(q, now){
  clearTimeout(F.timer);
  F.timer = setTimeout(async () => {
    const seq = ++F.seq;
    let r;
    try{ r = await window.pywebview.api.find(q) }catch(e){ console.log(e); return }
    if(seq !== F.seq || mode !== 'find') return;   // une frappe plus récente est arrivée
    // index en cours de construction ou de mise à jour : on relance la même recherche un peu plus tard
    if(r.building || (r.info && r.info.refreshing)){ setTimeout(() => { if(F.seq === seq && mode === 'find') findQuery(q, true) }, 600) }
    const keep = q === F.q ? F.sel : 0;   // mise à jour silencieuse : on garde la sélection
    F.res = r.results || []; F.sel = Math.min(keep, Math.max(0, F.res.length - 1)); F.q = q; renderFind(r);
  }, now ? 0 : 70);
}
function when(t){
  const d = new Date(t * 1000), n = new Date(), day = 864e5;
  const d0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  const hm = d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
  if(d.getTime() >= d0) return "aujourd'hui " + hm;
  if(d.getTime() >= d0 - day) return 'hier ' + hm;
  if(d.getTime() >= d0 - 6 * day) return d.toLocaleDateString('fr-FR', {weekday:'long'});
  return d.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric'});
}
function human(n){
  if(n == null) return '';
  const u = ['o','Ko','Mo','Go']; let i = 0;
  while(n >= 1024 && i < 3){ n /= 1024; i++ }
  return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + ' ' + u[i];
}
function hlName(name, spans){
  let out = '', k = 0;
  for(const [a, b] of spans || []){ out += esc(name.slice(k, a)) + '<mark>' + esc(name.slice(a, b)) + '</mark>'; k = b }
  return out + esc(name.slice(k));
}
function renderFind(r){
  const fl = document.getElementById('fl'), fc = document.getElementById('fc');
  if(!fl) return;
  const info = r.info || {};
  if(r.building && !F.res.length){
    fl.innerHTML = `<div class="f-empty">${icon('loader-circle', 26)}<b>Je fais l'inventaire de tes fichiers…</b>Quelques secondes, la première fois seulement.</div>`;
    fc.textContent = ''; return;
  }
  if(!F.res.length){
    fl.innerHTML = `<div class="f-empty">${icon('search-x', 28)}<b>Aucun fichier ne correspond</b>Essaie avec un seul mot, ou une partie du nom.</div>`;
  }else{
    const head = info.mode === 'recents' ? '<div class="f-sec">Modifiés récemment</div>'
      : info.mode === 'flou' ? '<div class="f-sec">Rien d\'exact — noms qui ressemblent</div>' : '';
    const rows = F.res.slice(0, head ? 6 : 7);
    fl.innerHTML = head + rows.map((x, i) => {
      const [ic, col] = KIND[x.kind] || KIND.file;
      return `<div class="f-row${i === F.sel ? ' on' : ''}" data-i="${i}">
        <div class="f-ic" style="--c:${col}">${icon(ic, 17)}</div>
        <div class="f-tx"><div class="f-nm">${hlName(x.name, x.hl)}</div><div class="f-dr"><bdi>${esc(x.dir)}</bdi></div></div>
        <div class="f-mt">${esc(when(x.mtime))}<br>${esc(human(x.size))}</div>
        <div class="f-act"><span data-a="open" title="Ouvrir">${icon('external-link', 15)}</span><span data-a="wheel" title="Roue FileForge">${icon('disc-3', 15)}</span></div>
      </div>`;
    }).join('');
    F.res = rows;
    fl.querySelectorAll('.f-row').forEach(el => {
      const i = +el.dataset.i;
      el.addEventListener('mouseenter', () => findSel(i));
      el.addEventListener('click', e => {
        const a = e.target.closest('[data-a]');
        findPick(a ? a.dataset.a : 'reveal', i);
      });
    });
  }
  const n = info.indexed || info.total || 0;
  fc.textContent = info.mode === 'recents' ? (n ? n.toLocaleString('fr-FR') + ' éléments indexés' : '')
    : (info.total > F.res.length ? (info.total > 20000 ? 'plus de 20 000' : info.total.toLocaleString('fr-FR')) + ' résultats · affine ta recherche' : '');
}
function findSel(i){
  F.sel = i;
  document.querySelectorAll('.f-row').forEach(el => el.classList.toggle('on', +el.dataset.i === i));
}
function findPick(action, i){
  const x = F.res[i ?? F.sel]; if(!x) return;
  if(action === 'wheel') showBusy('Ouverture de la roue…');
  api({find: action, path: x.path});
}
function findKey(e){
  const k = e.key;
  e.stopPropagation();
  if(k === 'ArrowDown' || k === 'ArrowUp'){
    e.preventDefault();
    if(F.res.length) findSel((F.sel + (k === 'ArrowDown' ? 1 : -1) + F.res.length) % F.res.length);
  }else if(k === 'Enter'){
    e.preventDefault(); findPick(e.metaKey || e.ctrlKey ? 'open' : e.altKey ? 'wheel' : 'reveal');
  }else if(k === 'Tab'){
    e.preventDefault(); findPick('wheel');
  }else if(k === 'Escape'){
    e.preventDefault();
    if(e.target.value){ e.target.value = ''; findQuery('', true) } else api('__close__');
  }
}

/* ───────── clavier / souris ───────── */
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag') });
document.addEventListener('dragleave', e => { if(!e.relatedTarget) document.body.classList.remove('drag') });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag') });
document.addEventListener('mousedown', e => {
  if((e.target === document.body || e.target === stage || e.target === document.documentElement) && (mode === 'main' || mode === 'drop' || mode === 'done' || mode === 'find')) api('__close__');
});
window.addEventListener('blur', () => {
  if(mode === 'find' && standalone){
    setTimeout(() => { if(!document.hasFocus() && mode === 'find') api('__close__') }, 200);
    return;
  }
  if(mode !== 'main' || query) return;
  const wait = (S && S.platform && S.platform.startsWith('linux')) ? 900 : 150;
  setTimeout(() => { if(!document.hasFocus() && mode === 'main') api('__close__') }, wait);
});

document.addEventListener('keydown', e => {
  if(mode === 'find'){
    // frappe arrivée avant que le champ ait le focus : on la lui transmet
    const inp = document.getElementById('fq');
    if(inp && document.activeElement !== inp){
      inp.focus();
      if(e.key.length === 1 && !e.metaKey && !e.ctrlKey){ e.preventDefault(); inp.value += e.key; findQuery(inp.value) }
      else if(e.key === 'Backspace'){ e.preventDefault(); inp.value = inp.value.slice(0, -1); findQuery(inp.value) }
      else findKey.call(inp, Object.assign(e, {}));
    }
    return;
  }
  if(mode === 'ask' || mode === 'busy') return;
  const k = e.key;
  if(mode === 'drop' && k.length === 1 && k !== ' ' && !e.metaKey && !e.ctrlKey){ e.preventDefault(); showFind(k); return }
  if(k === 'Escape'){
    e.preventDefault();
    if(mode === 'main'){ if(query){ query = ''; renderSearch() } else api('__close__') }
    else if(mode === 'drop' || mode === 'done' || mode === 'error') api('__close__');
    else api('__cancel__');
    return;
  }
  if(mode === 'main'){
    if(k.length === 1 && !e.metaKey && !e.ctrlKey && (query || k !== ' ')){ query += k; renderSearch(); e.preventDefault(); return }
    if(k === 'Backspace' && query){ query = query.slice(0, -1); renderSearch(); e.preventDefault(); return }
    const n = S.cats.length;
    if(query){
      if((k === 'ArrowRight' || k === 'ArrowDown' || k === 'Tab') && fanItems.length){ kb.ai = (kb.ai + 1) % fanItems.length }
      else if((k === 'ArrowLeft' || k === 'ArrowUp') && fanItems.length){ kb.ai = (kb.ai - 1 + fanItems.length) % fanItems.length }
      else if(k === 'Enter' && fanItems[kb.ai]){ pick(fanItems[kb.ai]); return }
      else return;
      e.preventDefault(); setOn(fanItems, kb.ai, 'kb'); hubAction(fanItems[kb.ai]); return;
    }
    if(kb.level === 'cat'){
      if(k === 'ArrowRight' || k === 'Tab'){ kb.ci = (kb.ci + 1) % n }
      else if(k === 'ArrowLeft'){ kb.ci = (kb.ci - 1 + n) % n }
      else if((k === 'ArrowDown' || k === 'Enter') && kb.ci >= 0){ kb.level = 'act'; kb.ai = 0; setOn(fanItems, 0, 'kb'); hubAction(fanItems[0]); e.preventDefault(); return }
      else return;
      e.preventDefault(); openCat(kb.ci); return;
    }
    if(kb.level === 'act'){
      const m = fanItems.length;
      if(k === 'ArrowRight' || k === 'Tab'){ kb.ai = (kb.ai + 1) % m }
      else if(k === 'ArrowLeft'){ kb.ai = (kb.ai - 1 + m) % m }
      else if(k === 'ArrowUp'){ kb.level = 'cat'; setOn(fanItems, -1, 'kb'); hubSet(hubInfo()); e.preventDefault(); return }
      else if(k === 'Enter'){ pick(fanItems[kb.ai]); return }
      else return;
      e.preventDefault(); setOn(fanItems, kb.ai, 'kb'); hubAction(fanItems[kb.ai]); return;
    }
  }
  if(ringItems.length){
    const m = ringItems.length;
    if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'Tab'){ kb.ai = (kb.ai + 1 + m) % m }
    else if(k === 'ArrowLeft' || k === 'ArrowUp'){ kb.ai = (Math.max(kb.ai, 0) - 1 + m) % m }
    else if(k === 'Enter' && kb.ai >= 0){ ringItems[kb.ai]._p.dispatchEvent(new MouseEvent('click')); return }
    else if(/^[1-9]$/.test(k) && +k <= m){ ringItems[+k - 1]._p.dispatchEvent(new MouseEvent('click')); return }
    else return;
    e.preventDefault(); setOn(ringItems, kb.ai, 'kb');
  }
});

window.FF = {
  show(st){
    try{
      if(st.mode === 'main') showMain(st);
      else if(st.mode === 'choice') showChoice(st);
      else if(st.mode === 'ask') showAsk(st);
      else if(st.mode === 'card') showCard(st);
      else if(st.mode === 'busy') showBusy(st.text);
      else if(st.mode === 'done') showDone(st);
      else if(st.mode === 'error') showError(st);
      else if(st.mode === 'drop') showDrop();
      else if(st.mode === 'find'){
        standalone = !!st.standalone;
        const i = document.getElementById('fq');
        if(mode === 'find' && i && !st.q) i.focus();     // déjà préparée (panneau en réserve) : on garde la page
        else showFind(st.q || '');
      }
    }catch(err){ console.log(err); try{ window.pywebview.api.jslog(String(err && err.stack || err)) }catch(e){} }
    return true;
  }
};
</script>
